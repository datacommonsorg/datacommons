[project]
name = "datacommons-devtools"
dynamic = ["version"]
description = "Internal developer tooling suite for Data Commons Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
  "click>=8.1.7",
]

[project.scripts]
datacommons-devtools = "datacommons_devtools.cli:cli"
dc-devtools = "datacommons_devtools.cli:cli"

[build-system]
requires = ["uv", "setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"datacommons_devtools.migrations" = ["templates/*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

