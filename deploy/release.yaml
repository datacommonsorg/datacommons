steps:
  # 1. Validate version consistency across local manifests and remote release artifacts
  - name: 'google/cloud-sdk:slim'
    id: 'validate-release-version'
    entrypoint: 'python3'
    args:
      - 'deploy/scripts/validate_release_version.py'
      - '$TAG_NAME'
      - '--check-remote-artifacts'

  # 2. Build and publish all Python packages to PyPI
  - name: 'ghcr.io/astral-sh/uv:python3.12-trixie-slim'
    id: 'publish-pypi-packages'
    entrypoint: 'python3'
    secretEnv:
      - 'PYPI_TOKEN'
    args:
      - 'deploy/scripts/publish_packages.py'
      - '--target'
      - 'pypi'
      - '--token-env'
      - 'PYPI_TOKEN'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/PYPI_TOKEN/versions/latest
    env: 'PYPI_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY

tags: ['pypi--datacommons-platform-prod']