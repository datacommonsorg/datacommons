steps:
  # 1. Validate version consistency across VERSION file, subpackage VERSION files, and pyproject.toml
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    env:
      - 'TAG_NAME=$TAG_NAME'
    args:
      - '-c'
      - |
        set -eo pipefail
        tag_version=$${TAG_NAME#v}
        version_in_file=$(tr -d '[:space:]' < VERSION)
        echo "Validating release tag '$tag_version' against root VERSION file '$version_in_file'..."
        if [ "$tag_version" != "$version_in_file" ]; then
          echo "ERROR: Release tag ($tag_version) does not match root VERSION file ($version_in_file)."
          exit 1
        fi

        echo "Validating subpackage VERSION files match '$tag_version'..."
        python3 -c "import glob, sys; invalid = [f for f in glob.glob('packages/*/VERSION') if open(f).read().strip() != '$tag_version']; sys.exit(f'ERROR: The following VERSION files do not match release version $tag_version: {invalid}') if invalid else None"

        echo "Validating datacommons-cli dependency lock in pyproject.toml matches '$tag_version'..."
        python3 -c "import sys; content = open('packages/datacommons-cli/pyproject.toml').read(); sys.exit(f'ERROR: packages/datacommons-cli/pyproject.toml does not lock datacommons-admin to ==$tag_version') if f'\"datacommons-admin==$tag_version\"' not in content else None"

        echo "Validating infra/dcp/variables.tf dcp_version default matches '$tag_version'..."
        python3 -c "import re, sys; content = open('infra/dcp/variables.tf').read(); sys.exit(f'ERROR: infra/dcp/variables.tf does not set dcp_version default to $tag_version') if not re.search(rf'variable\s+\"dcp_version\"\s+\{{[^}}]*default\s*=\s*\"{re.escape(\"$tag_version\")}\"', content) else None"

  # 2. Build and publish all Python packages to PyPI
  - name: 'ghcr.io/astral-sh/uv:python3.12-trixie-slim'
    entrypoint: 'bash'
    secretEnv:
      - 'PYPI_TOKEN'
    args:
      - '-c'
      - |
        set -eo pipefail
        # NOTE: The loop below processes packages/ alphabetically (datacommons-admin before datacommons-cli).
        # This order is strictly required because datacommons-cli depends on datacommons-admin==VERSION.
        # Reordering such that cli comes before admin will cause PyPI dependency resolution failures during publish.
        for pkg in packages/*; do
          pkg_name=$(basename "$pkg")
          if [ "$pkg_name" = "datacommons-db" ] || [ "$pkg_name" = "datacommons-api" ] || [ "$pkg_name" = "datacommons-schema" ]; then
            echo "Skipping experimental package $pkg_name..."
            continue
          fi
          if [ -d "$pkg" ] && [ -f "$pkg/pyproject.toml" ]; then
            echo "Building and publishing $pkg..."
            (
              cd "$pkg"
              rm -rf dist/ build/ *.egg-info
              uv build --out-dir dist
              uv publish --token $$PYPI_TOKEN
            )
          fi
        done

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/PYPI_TOKEN/versions/latest
    env: 'PYPI_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY

tags: ['pypi--datacommons-platform-prod']