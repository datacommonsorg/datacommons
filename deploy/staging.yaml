steps:
  # 1. Clone target commit/branch, apply version bump, and push RC tag to GitHub
  - name: 'ghcr.io/astral-sh/uv:python3.12-trixie-slim'
    entrypoint: 'bash'
    secretEnv: ['GH_TOKEN']
    env:
      - 'TARGET_VERSION=${_TARGET_VERSION}'
      - 'GITHUB_COMMIT=${_GITHUB_COMMIT}'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y git

        if [ -z "$$TARGET_VERSION" ]; then
          echo "ERROR: Substitution _TARGET_VERSION is required (e.g. _TARGET_VERSION='1.2.3rc1')."
          exit 1
        fi
        tag_version="$$TARGET_VERSION"

        if [ -n "$$GH_TOKEN" ]; then
          git config --global url."https://${_GITHUB_AUTHOR}:$$GH_TOKEN@github.com/".insteadOf "https://github.com/"
          git config --global user.email "${_GITHUB_AUTHOR}@users.noreply.github.com"
          git config --global user.name "${_GITHUB_AUTHOR}"
        fi

        # Determine target ref: substitution _GITHUB_COMMIT > default _GITHUB_BRANCH
        target_ref="$$GITHUB_COMMIT"
        if [ -z "$target_ref" ]; then
          target_ref="${_GITHUB_BRANCH}"
        fi

        echo "Cloning repository and checking out target ref '$target_ref'..."
        rm -rf /workspace/* /workspace/.[!.]*
        git clone "https://github.com/${_GITHUB_ORG}/${_GITHUB_REPO}.git" /workspace
        cd /workspace
        git checkout "$target_ref"

        echo "Applying version bump for staging release candidate $tag_version..."
        bash deploy/scripts/apply_version_bump.sh "$tag_version"

        if [ -n "$$GH_TOKEN" ]; then
          echo "Creating local RC commit and tagging v$tag_version on GitHub..."
          git add -A
          git commit -m "chore(rc): bump version files for v$tag_version" || true
          git tag -f "v$tag_version"
          git push origin "v$tag_version" --force || echo "Warning: Failed to push tag v$tag_version to GitHub"
        fi

  # 2. Build and publish all Python packages to TestPyPI
  - name: 'ghcr.io/astral-sh/uv:python3.12-trixie-slim'
    entrypoint: 'bash'
    secretEnv:
      - 'TEST_PYPI_TOKEN'
    args:
      - '-c'
      - |
        # NOTE: The loop below processes packages/ alphabetically (datacommons-admin before datacommons-cli).
        # This order is strictly required because datacommons-cli depends on datacommons-admin>=VERSION.
        # Reordering such that cli comes before admin will cause TestPyPI dependency resolution failures during publish.
        for pkg in packages/*; do
          pkg_name=$(basename "$pkg")
          if [ "$pkg_name" = "datacommons-db" ] || [ "$pkg_name" = "datacommons-api" ] || [ "$pkg_name" = "datacommons-schema" ]; then
            echo "Skipping experimental package $pkg_name..."
            continue
          fi
          if [ -d "$pkg" ] && [ -f "$pkg/pyproject.toml" ]; then
            echo "Building and publishing $pkg..."
            cd "$pkg"
            rm -rf dist/ build/ *.egg-info
            uv build --out-dir dist
            uv publish --token $$TEST_PYPI_TOKEN --publish-url https://test.pypi.org/legacy/
            cd -
          fi
        done

substitutions:
  _GITHUB_AUTHOR: 'datacommons-robot-author'
  _GITHUB_ORG: 'datacommonsorg'
  _GITHUB_REPO: 'datacommons'
  _GITHUB_BRANCH: 'main'
  _GITHUB_COMMIT: ''
  _TARGET_VERSION: ''

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/TEST_PYPI_TOKEN/versions/latest
    env: 'TEST_PYPI_TOKEN'
  - versionName: projects/$PROJECT_ID/secrets/agent-toolkit-github-pat/versions/latest
    env: 'GH_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY

tags: ['pypi--datacommons-platform-staging']