steps:
  # 1. Optionally tag release artifacts if promoting from a verified release candidate
  - name: 'google/cloud-sdk:slim'
    id: 'promote-release-artifacts'
    entrypoint: 'bash'
    env:
      - 'NEW_VERSION=${_NEW_VERSION}'
      - 'PROMOTED_CANDIDATE_TAG=${_PROMOTED_CANDIDATE_TAG}'
    args:
      - '-c'
      - |
        set -eo pipefail
        if [ -n "$$PROMOTED_CANDIDATE_TAG" ]; then
          echo "Promoting release artifacts from candidate '$$PROMOTED_CANDIDATE_TAG' to target '$$NEW_VERSION'..."
          python3 deploy/scripts/tag_release_artifacts.py \
            --target-tag "$$NEW_VERSION" \
            --default-source-tag "$$PROMOTED_CANDIDATE_TAG"
        else
          echo "No candidate tag (_PROMOTED_CANDIDATE_TAG) provided; skipping artifact promotion tagging."
        fi

  # 2. Update version files, lockfile, commit, and create bump PR
  - name: 'ghcr.io/astral-sh/uv:python3.12-trixie-slim'
    id: 'create-bump-pr'
    entrypoint: bash
    secretEnv: ['GH_TOKEN']
    env: ['NEW_VERSION=${_NEW_VERSION}']
    args:
      - -c
      - |
        set -eo pipefail

        if [ -z "$$NEW_VERSION" ]; then
          echo "ERROR: Substitution _NEW_VERSION is required (e.g. _NEW_VERSION='1.2.3')."
          exit 1
        fi

        apt-get update && apt-get install -y git curl gh

        # Config Git with Robot Author
        git config --global url."https://${_GITHUB_AUTHOR}:$$GH_TOKEN@github.com/".insteadOf "https://github.com/"
        git config --global credential.helper store
        echo "https://${_GITHUB_AUTHOR}:$$GH_TOKEN@github.com" > /root/.git-credentials
        chmod 600 /root/.git-credentials
        
        git config --global user.email "${_GITHUB_AUTHOR}@users.noreply.github.com"
        git config --global user.name "${_GITHUB_AUTHOR}"

        # Clone Repo
        rm -rf /workspace/* /workspace/.[!.]*
        git clone "https://github.com/${_GITHUB_ORG}/${_GITHUB_REPO}.git" /workspace --branch "${_GITHUB_BRANCH}" --single-branch --depth 1

        # Create Branch
        BRANCH_NAME="chore/bump-version-$$NEW_VERSION"
        git checkout -b $$BRANCH_NAME

        # Update Version Files using shared script
        python3 deploy/scripts/apply_version_bump.py "$$NEW_VERSION"

        # Update Lockfile
        uv lock

        # Commit & Push modified tracked files from apply_version_bump script
        git add -u
        git commit -m "chore: bump version to $$NEW_VERSION"
        git push origin $$BRANCH_NAME --force


        # Create PR if not already present
        if gh pr view "$$BRANCH_NAME" --repo "${_GITHUB_ORG}/${_GITHUB_REPO}" > /dev/null 2>&1; then
          echo "PR for branch $$BRANCH_NAME already exists and was updated via force push."
        else
          gh pr create \
            --repo "${_GITHUB_ORG}/${_GITHUB_REPO}" \
            --title "chore: bump version to $$NEW_VERSION" \
            --body "Automated PR from Cloud Build release pipeline matching to update our version to $$NEW_VERSION ahead of its release" \
            --base "${_GITHUB_BRANCH}" \
            --head "$$BRANCH_NAME"
        fi

substitutions:
  _GITHUB_AUTHOR: 'datacommons-robot-author'
  _GITHUB_ORG: 'datacommonsorg'
  _GITHUB_REPO: 'datacommons'
  _GITHUB_BRANCH: 'main'
  _NEW_VERSION: ''
  _PROMOTED_CANDIDATE_TAG: ''

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/agent-toolkit-github-pat/versions/latest
    env: 'GH_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY