# ==============================================================================
# Multi-Entity SDMX & Hybrid Dimension Test Specification
# ==============================================================================
# Scenario:
#   Validates multi-entity statistical variables (variables with multiple custom
#   observationProperties) across federated Data Commons Platform (DCP) instances.
#
# Key Regressions Tested:
#   1. Remote Mixer Error Suppression: In federated mode, Remote Mixer returns an
#      error when querying custom local properties (e.g. 'sector'). Tests verify
#      Mixer suppresses the remote error and returns local Spanner data (HTTP 200)
#      instead of cascading into an HTTP 500 Internal Server Error.
#   2. Multi-Dimension Resolution: Variables combining BaseDC standard properties
#      ('sex') and custom local schema properties ('sector').
#   3. Negative Constraint Validation: Verifies that invalid or mismatched dimension
#      filters cleanly return HTTP 400 Bad Request rather than HTTP 500.
#   4. Dimension Component Availability: Verifies facet value discovery on '/*/sex'
#      and '/*/sector'.
# ==============================================================================

name: "foo_multientity"
description: "Multi-entity dataset with sex and sector dimension properties"

stages:
  ingestion: true
  postprocessing: false
  serving_api: true
  mcp_agent: true
  sdmx: true

ingestion:
  dataset_dirs:
    - "tests/integration/test_data/foo_multientity"
  spanner_expectations:
    exact_observation_count: 8
    expected_nodes:
      - subject_id: "FooGroup"
        expected_types: ["StatVarGroup"]
      - subject_id: "EmployedAdultsBySexAndSector"
        expected_types: ["StatisticalVariable"]
      - subject_id: "SectorEnum"
        expected_types: ["Class"]
      - subject_id: "sector"
        expected_types: ["Property"]
      - subject_id: "TechSector"
        expected_types: ["SectorEnum"]
    expected_edges:
      - subject_id: "EmployedAdultsBySexAndSector"
        predicate: "memberOf"
        object_id: "FooGroup"
      - subject_id: "SectorEnum"
        predicate: "subClassOf"
        object_id: "Enumeration"
      - subject_id: "TechSector"
        predicate: "typeOf"
        object_id: "SectorEnum"

serving_api:
  nodes:
    - node_dcid: "EmployedAdultsBySexAndSector"
      expression: "->name"
      expected_values: ["Employed adults by sex and sector"]

  sdmx_3_0:
    data_queries:
      # ------------------------------------------------------------------------
      # Scenario 1: BaseDC Dimension Resolution (sex=Female)
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "EmployedAdultsBySexAndSector"
          observationAbout: "country/USA"
          sex: "Female"
        format: "csv"
        expected_status: 200
        expected_csv_contains: ["Female", "country/USA", "4500000"]

      # ------------------------------------------------------------------------
      # Scenario 2: Local Custom Dimension Resolution (sector=TechSector)
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "EmployedAdultsBySexAndSector"
          observationAbout: "country/USA"
          sector: "TechSector"
        format: "csv"
        expected_status: 200
        expected_csv_contains: ["TechSector", "country/USA"]

      # ------------------------------------------------------------------------
      # Scenario 3: Hybrid Combined Dimension Resolution
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "EmployedAdultsBySexAndSector"
          observationAbout: "country/ALB"
          sex: "Male"
          sector: "HealthcareSector"
        format: "csv"
        expected_status: 200
        expected_csv_contains: ["country/ALB", "Male", "HealthcareSector", "31000"]

      # ------------------------------------------------------------------------
      # Scenario 4: Negative Test — Constraint Mismatch Validation
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "EmployedAdultsBySexAndSector"
          invalidDimension: "Invalid"
        expected_status: 400
        expected_error_contains: "unsupported SDMX component filter"

    availability_queries:
      # ------------------------------------------------------------------------
      # Scenario 5: Availability Discovery on BaseDC Dimension Component
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*/sex"
        constraints:
          variableMeasured: "EmployedAdultsBySexAndSector"
          observationAbout: "country/USA"
        expected_status: 200
        expected_values_contain: ["Female", "Male"]

      # ------------------------------------------------------------------------
      # Scenario 6: Availability Discovery on Local Dimension Component
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*/sector"
        constraints:
          variableMeasured: "EmployedAdultsBySexAndSector"
        expected_status: 200
        expected_values_contain: ["TechSector", "HealthcareSector"]

  mcp_agent:
    tool_calls:
      # ------------------------------------------------------------------------
      # Scenario 7: Model Context Protocol (MCP) Multi-Entity Observation Tool
      # ------------------------------------------------------------------------
      - tool_name: "get_multi_entity_observations"
        arguments:
          variable_dcid: "EmployedAdultsBySexAndSector"
          entity_dcids: ["country/USA"]
        expected_match_dcids: ["country/USA"]
