name: "custom_namespace"
description: "FooBar custom namespace education indicators"

stages:
  ingestion: true
  postprocessing: true
  serving_api: true
  mcp_agent: true
  sdmx: false

ingestion:
  dataset_dirs:
    - "tests/integration/test_data/custom_namespace"
  spanner_expectations:
    exact_observation_count: 6
    expected_nodes:
      - subject_id: "FooBarCustomEducation"
        expected_types: ["Provenance"]
      - subject_id: "custom:foobar/SchoolCompletionRate"
        expected_types: ["StatisticalVariable"]
      - subject_id: "custom:foobar/YouthLiteracyRate"
        expected_types: ["StatisticalVariable"]
      - subject_id: "FooBarCustomGroup"
        expected_types: ["StatVarGroup"]
    expected_edges:
      - subject_id: "FooBarCustomEducation"
        predicate: "source"
        object_id: "dc/s/CustomFooBarSource"
      - subject_id: "custom:foobar/SchoolCompletionRate"
        predicate: "memberOf"
        object_id: "FooBarCustomGroup"

postprocessing:
  svg_hierarchy:
    expected_specialization_edges:
      - subject_id: "FooBarCustomGroup"
        parent_svg: "dc/g/Root"
  indicator_resolutions:
    - query: "school completion"
      target: "custom_only"
      expected_candidate_dcids: ["custom:foobar/SchoolCompletionRate"]
    - query: "youth literacy"
      target: "custom_only"
      expected_candidate_dcids: ["custom:foobar/YouthLiteracyRate"]

serving_api:
  nodes:
    - node_dcid: "custom:foobar/SchoolCompletionRate"
      expression: "->name"
      expected_values: ["FooBar School Completion Rate"]

  point_observations:
    - observation_about: ["country/USA"]
      variables: ["custom:foobar/SchoolCompletionRate"]
      date: "LATEST"
      expected_places_with_data: ["country/USA"]

  mcp_agent:
    tool_calls:
      - tool_name: "search_indicators"
        arguments:
          query: "school completion rate"
        expected_match_dcids: ["custom:foobar/SchoolCompletionRate"]
