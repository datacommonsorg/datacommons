# ==============================================================================
# Global Health Aid Flow Test Specification (Multi-Entity Benchmark)
# ==============================================================================
# Principles Enforced:
#   1. Targeted Contract Assertions: Specific HTTP codes, headers, and facet values.
#   2. Living Contract of DCP Multi-Entity Features:
#      - Remote Mixer error suppression (BaseDC 400 rejected, local 200 served).
#      - 3-way entity sharding (donorPlace, recipientPlace, medicalCondition).
#      - Cascading/constrained SDMX availability discovery.
#      - Model Context Protocol (MCP) multi-entity observation retrieval.
#   3. Zero Redundancy: 100% focused on multi-entity dimension capabilities.
# ==============================================================================

name: "health_aid"
description: "Multi-entity health aid dataset with donor, recipient, and disease dimensions"

stages:
  ingestion: true
  postprocessing: false
  serving_api: true
  mcp_agent: true
  sdmx: true

ingestion:
  dataset_dirs:
    - "tests/integration/test_data/health_aid"
  spanner_expectations:
    exact_observation_count: 16
    expected_nodes:
      - subject_id: "GlobalHealthAidGroup"
        expected_types: ["StatVarGroup"]
      - subject_id: "GlobalHealthAidSource"
        expected_types: ["Source"]
      - subject_id: "GlobalHealthAidProvenance"
        expected_types: ["Provenance"]
      - subject_id: "donorPlace"
        expected_types: ["Property"]
      - subject_id: "recipientPlace"
        expected_types: ["Property"]
      - subject_id: "HealthAidFunding"
        expected_types: ["StatisticalVariable"]
    expected_edges:
      - subject_id: "HealthAidFunding"
        predicate: "memberOf"
        object_id: "GlobalHealthAidGroup"
      - subject_id: "GlobalHealthAidProvenance"
        predicate: "source"
        object_id: "GlobalHealthAidSource"

serving_api:
  nodes:
    - node_dcid: "HealthAidFunding"
      expression: "->name"
      expected_values: ["Global health aid funding by donor, recipient, and medical condition"]

  sdmx_3_0:
    data_queries:
      # ------------------------------------------------------------------------
      # Scenario 1: Primary Entity Dimension Filter (donorPlace=country/USA)
      # Tests Remote Mixer error suppression and local Spanner multi-series serving.
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "HealthAidFunding"
          donorPlace: "country/USA"
        format: "csv"
        expected_status: 200
        expected_csv_contains: ["country/USA", "country/KEN", "50000000"]

      # ------------------------------------------------------------------------
      # Scenario 2: Cross-Entity Secondary Slice (recipientPlace & medicalCondition)
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "HealthAidFunding"
          recipientPlace: "country/KEN"
          medicalCondition: "Malaria"
        format: "csv"
        expected_status: 200
        expected_csv_contains: ["country/KEN", "Malaria", "50000000", "15000000"]

      # ------------------------------------------------------------------------
      # Scenario 3: All-Dimension 3-Way Point Lookup (FRA -> NGA -> HIV)
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "HealthAidFunding"
          donorPlace: "country/FRA"
          recipientPlace: "country/NGA"
          medicalCondition: "HIV"
        format: "csv"
        expected_status: 200
        expected_csv_contains: ["country/FRA", "country/NGA", "HIV", "18000000"]

      # ------------------------------------------------------------------------
      # Scenario 4: Negative Test — Unsupported Component Filter
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*"
        constraints:
          variableMeasured: "HealthAidFunding"
          invalidDimension: "Invalid"
        expected_status: 400
        expected_error_contains: "unsupported SDMX component filter"

    availability_queries:
      # ------------------------------------------------------------------------
      # Scenario 5: Unconstrained Dimension Discovery on BaseDC Condition Nodes
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*/medicalCondition"
        constraints:
          variableMeasured: "HealthAidFunding"
        expected_status: 200
        expected_values_contain: ["Malaria", "Tuberculosis", "HIV"]

      # ------------------------------------------------------------------------
      # Scenario 6: Cascading / Constrained Availability for Kenya (Excludes HIV)
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*/medicalCondition"
        constraints:
          variableMeasured: "HealthAidFunding"
          recipientPlace: "country/KEN"
        expected_status: 200
        expected_values_contain: ["Malaria", "Tuberculosis"]

      # ------------------------------------------------------------------------
      # Scenario 7: Dimension Discovery on Recipient Places
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*/recipientPlace"
        constraints:
          variableMeasured: "HealthAidFunding"
        expected_status: 200
        expected_values_contain: ["country/KEN", "country/NGA"]

      # ------------------------------------------------------------------------
      # Scenario 8: Dimension Discovery on Donor Places
      # ------------------------------------------------------------------------
      - dataflow: "DC/DF_OBS/1.0.0/*/donorPlace"
        constraints:
          variableMeasured: "HealthAidFunding"
        expected_status: 200
        expected_values_contain: ["country/USA", "country/FRA"]

  mcp_agent:
    tool_calls:
      # ------------------------------------------------------------------------
      # Scenario 9: MCP Multi-Entity Observation Tool Execution
      # ------------------------------------------------------------------------
      - tool_name: "get_multi_entity_observations"
        arguments:
          variable_dcid: "HealthAidFunding"
          entities:
            donorPlace: ["country/USA"]
            recipientPlace: ["country/KEN"]
        expected_match_dcids: ["country/USA"]
