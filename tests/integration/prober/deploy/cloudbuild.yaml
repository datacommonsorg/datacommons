steps:
  # 1. Build and push container image (tagged with both :${_TAG} and :latest)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-prober-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGISTRY_BASE}/${_IMAGE_NAME}:latest || true
        docker build \
          --build-arg COMMIT_SHA=${_COMMIT_SHA} \
          --cache-from ${_REGISTRY_BASE}/${_IMAGE_NAME}:latest \
          -t ${_REGISTRY_BASE}/${_IMAGE_NAME}:${_TAG} \
          -t ${_REGISTRY_BASE}/${_IMAGE_NAME}:latest \
          -f tests/integration/prober/deploy/Dockerfile \
          .
        docker push ${_REGISTRY_BASE}/${_IMAGE_NAME}:${_TAG}
        docker push ${_REGISTRY_BASE}/${_IMAGE_NAME}:latest

  # 2. Update Cloud Run Job (only on automated CI/CD trigger; skipped during Terraform local deploy)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'update-prober-job-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_UPDATE_JOB}" = "true" ]; then
          echo "Updating Cloud Run Job '${_PROBER_NAME}' with new image ${_REGISTRY_BASE}/${_IMAGE_NAME}:${_TAG}..."
          gcloud run jobs update ${_PROBER_NAME} \
            --image="${_REGISTRY_BASE}/${_IMAGE_NAME}:${_TAG}" \
            --region="${_REGION}" \
            --project="${_PROJECT_ID}"
        else
          echo "Skipping Cloud Run job update (_UPDATE_JOB is false; managed via Terraform)."
        fi

substitutions:
  _UPDATE_JOB: 'true'
  _COMMIT_SHA: 'latest'
  _TAG: 'latest'
  _PROJECT_ID: 'datcom-dcp'
  _PROBER_NAME: 'dcp-prober'
  _REGION: 'us-central1'
  _IMAGE_NAME: 'datacommons-platform-prober'
  _REGISTRY_BASE: 'us-docker.pkg.dev/datcom-ci/datcom-tools'

images:
  - '${_REGISTRY_BASE}/${_IMAGE_NAME}:${_TAG}'
  - '${_REGISTRY_BASE}/${_IMAGE_NAME}:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

