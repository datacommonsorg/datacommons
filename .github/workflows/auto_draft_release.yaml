name: Auto-Draft Release

on:
  push:
    branches:
      - main

jobs:
  check-bump:
    runs-on: ubuntu-latest
    outputs:
      is_bump: ${{ steps.check-bump.outputs.is_bump }}
      version: ${{ steps.check-bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if version bump commit
        id: check-bump
        run: |
          commit_msg=$(git log -1 --pretty=%B)
          echo "Commit message: $commit_msg"
          if [[ "$commit_msg" =~ ^chore:\ bump\ version\ to\ ([0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?) ]]; then
            version="${BASH_REMATCH[1]}"
            echo "is_bump=true" >> $GITHUB_OUTPUT
            echo "version=$version" >> $GITHUB_OUTPUT
            echo "Detected version bump to: $version"
          else
            echo "is_bump=false" >> $GITHUB_OUTPUT
            echo "Not a version bump commit."
          fi

  hermetic-integration-test:
    needs: check-bump
    if: needs.check-bump.outputs.is_bump == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --locked

      # Runs the integration tests using the local emulated Docker Compose stack.
      - name: Run hermetic integration test
        run: uv run pytest tests/integration/suites/03_serving_api/ --instance=local --test-config=foobar_wages
