name: Schema Freeze Guard

on:
  pull_request:
    # Trigger on edits or label changes so adding 'schema-squash' label or '[schema-squash]' to title/body re-runs the check
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-schema-freeze:
    name: Verify Canonical Schema Is Frozen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check if schema.sql was modified
        id: check_modified
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "Running in merge_group, bypassing schema freeze check."
            echo "modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE_SHA" HEAD | grep -q "^packages/datacommons-db/datacommons_db/schema/schema.sql$"; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for Schema Squash Bypass
        id: check_bypass
        if: steps.check_modified.outputs.modified == 'true'
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_LABELS" | grep -iq "schema-squash" || echo "$PR_TITLE $PR_BODY" | grep -iq "\[schema-squash\]"; then
            echo "bypass=true" >> "$GITHUB_OUTPUT"
            echo "✔ 'schema-squash' bypass detected. Allowing schema.sql modification."
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block Direct Schema Modifications
        if: steps.check_modified.outputs.modified == 'true' && steps.check_bypass.outputs.bypass != 'true'
        run: |
          echo "::error file=packages/datacommons-db/datacommons_db/schema/schema.sql,title=Direct schema.sql Edits Prohibited::Direct modifications to schema.sql are strictly prohibited!"
          echo "================================================================================"
          echo "⛔ CRITICAL: DIRECT MODIFICATIONS TO schema.sql ARE PROHIBITED"
          echo "================================================================================"
          echo "Data Commons has moved to a migration-based schema management model."
          echo ""
          echo "➡️ HOW TO EVOLVE THE SCHEMA:"
          echo "All schema changes (tables, indexes, columns, tokenlists) must be created as"
          echo "formal migration files in datacommons-db:"
          echo "  packages/datacommons-db/datacommons_db/migrations/migration_scripts"
          echo ""
          echo "CLI Tool: uv run datacommons-devtools migrations create <name>"
          echo ""
          echo "⚠️ HOW TO BYPASS FOR PLANNED SQUASHES:"
          echo "If you are performing an official, planned repo-wide migration squash:"
          echo "  1. Add the 'schema-squash' label to this Pull Request, OR"
          echo "  2. Include '[schema-squash]' in the PR title or description."
          echo "================================================================================"
          exit 1
