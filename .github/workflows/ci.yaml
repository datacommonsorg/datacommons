name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  fileset-diff:
    name: Analyze Fileset Diffs
    runs-on: ubuntu-latest
    outputs:
      code_changes: ${{ steps.filter.outputs.code_changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code_changes:
              - '!docs/**'
              - '!**.md'
              - '!.gitignore'
              - '!LICENSE'
              - '!experimental/**'
              - '!build/**'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting with Ruff
        run: uv run ruff format --check

      # TODO(dwnoble): Fix formatting issues in datacommons-schema and uncomment these
      #- name: Lint with Ruff
      #  run: uv run ruff check

      - name: Run tests
        run: |
          # Enable parallel test execution
          uv run pytest

  hermetic-integration-test:
    needs: fileset-diff
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.fileset-diff.outputs.code_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Runs the integration tests using Docker Compose.
      # Note: This tests the local Python package code on the host runner against
      # pre-built backend service containers. By default, the containers pull
      # the `:latest` image tags defined in docker-compose.test.yml.
      # To validate against a specific release version or pinned tag (e.g. during a release candidate build),
      # you can override the target images by setting the env variables, for example:
      # env:
      #   HELPER_IMAGE: gcr.io/datcom-ci/datacommons-ingestion-helper:v1.2.3rc1
      #   SERVICES_IMAGE: gcr.io/datcom-ci/datacommons-services:v1.2.3rc1
      - name: Run hermetic integration test
        run: uv run python tests/integration/run_e2e_tests.py --instance=emulated --test-config=foobar_wages




