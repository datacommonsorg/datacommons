name: Integration Tests

on:
  schedule:
    # Run weekdays (Monday through Thursday) at 02:00 UTC (tests latest images)
    - cron: '0 2 * * 1-4'

  release:
    types: [published]
  workflow_dispatch:
    # Allow manual trigger via GitHub UI with optional tag override
    inputs:
      version_tag:
        description: 'Image tag to test (e.g. latest, stable, 1.1.0). If empty, defaults to latest.'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: 'read'

jobs:
  hermetic-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --locked

      - name: Determine Image Tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Strip 'v' prefix if present (e.g. v1.1.1 -> 1.1.1)
            RAW_TAG="${{ github.event.release.tag_name }}"
            TAG="${RAW_TAG#v}"
            echo "Using release image tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            echo "Using manual input image tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "Using default cron image tag: latest"
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Run Hermetic Integration Test
        env:
          HELPER_IMAGE: gcr.io/datcom-ci/datacommons-ingestion-helper:${{ steps.image-tag.outputs.tag }}
          SERVICES_IMAGE: gcr.io/datcom-ci/datacommons-services:${{ steps.image-tag.outputs.tag }}
        run: |
          uv run pytest tests/integration/suites/ \
            --instance=local \
            --test-config=foobar_wages
