name: GCP Sandbox Integration Test

on:
  schedule:
    # Run weekdays (Monday through Thursday) at 02:00 UTC (tests latest images)
    - cron: '0 2 * * 1-4'

  release:
    types: [published]
  workflow_dispatch:
    # Allow manual trigger via GitHub UI with optional tag override
    inputs:
      version_tag:
        description: 'Image tag to test (e.g. latest, stable, 1.1.0). If empty, defaults to latest.'
        required: false
        type: string
        default: 'latest'
      confirm_resource_cost:
        description: 'Type "yes" to authorize the high GCP sandbox resource cost of this run.'
        required: true
        type: string
        default: 'no'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  gcp-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation (Manual Runs Only)
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_RESOURCE_COST: ${{ github.event.inputs.confirm_resource_cost }}
        run: |
          if [ "${CONFIRM_RESOURCE_COST,,}" != "yes" ]; then
            echo "Error: High-cost execution confirmation was not authorized (must type 'yes')."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@71f9e575d58634b8d75262757721a2ea5b107762 # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up GCP Cloud SDK
        uses: google-github-actions/setup-gcloud@6188d52e2f963812d81d8352ba393b45155f9e71 # v2.1.4
        with:
          project_id: datcom-ci

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@86029e0090680a6cfb17d092652b417e923e597a # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --locked

      - name: Determine Image Tag
        id: image-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            # Strip 'v' prefix if present (e.g. v1.1.1 -> 1.1.1)
            RAW_TAG="$RELEASE_TAG"
            TAG="${RAW_TAG#v}"
            echo "Using release image tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            echo "Using manual input image tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Using default cron image tag: latest"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GCP Integration Test
        env:
          DC_API_KEY: ${{ secrets.DC_API_KEY }}
          TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          uv run python tests/integration/prober/prober_runner.py \
            --project datcom-ci \
            --target-tag "$TAG"


